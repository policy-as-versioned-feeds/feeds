name: fetch

# The publisher's clock (ADR-0023, decision D2). Once a day, per feed: read
# upstream, compute the bump against what is published under that feed's own
# versioned rule.yaml, and then take exactly one of two paths.
#
#   bump != none  ->  open a PR carrying the new payload and the declared
#                     bump. A HUMAN merges it, and a human then dispatches
#                     cut-release.yml. This workflow never releases.
#   bump == none  ->  append one JSON line to observations/<feed>.jsonl on the
#                     `observations` branch, so a sub-threshold series
#                     survives for scoring and is never lost to a threshold.
#
# D1 in one sentence: this clock appends observations and proposes changes; it
# never commits a declaration to main. The observation commit is gitsign-signed
# by this workflow's own Actions identity, so the lane is a cage and not a
# policy statement.
#
# 03:17 UTC: off the hour, so this repo's clock does not queue behind every
# other cron in the org. No cross-org ordering is promised (spec, ticket 28).
#
# Ticket 28 / ADR-0024 added the CAGE around that observation path. The final
# step stages only the paths in OBSERVATION_LANE below and fails the run if the
# job left anything else in the tree, so a bug that wrote a feed, a bump or a pin
# on the clock cannot reach any branch. The server-side half is
# .github/rulesets/observation-lane.json, which the owner applies with `gh api`.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

# The observation lane, declared once as data so the cage step and
# verify/schedules/verify-schedules.sh read the SAME list (ADR-0024, D1). These
# are the only paths any scheduled job in this repository may ever commit.
env:
  OBSERVATION_LANE: "talk/truth.log drift/samples.jsonl talk/captures observations"
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # one job at a time: every feed pushes the same `observations` branch, and two
      # parallel pushes would race into a non-fast-forward rejection every day
      max-parallel: 1
      matrix:
        feed: [threat-register, cve, eol, fx, market-moves, news]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

      - name: fetch upstream and compute the bump under rule.yaml
        id: fetch
        run: |
          set -euo pipefail
          python3 "fetch/${{ matrix.feed }}.py" --observations-dir "${RUNNER_TEMP}/obs"

      - name: propose the release as a PR (bump is not none -- a human merges)
        if: steps.fetch.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.fetch.outputs.bump }}
          VERSION: ${{ steps.fetch.outputs.version }}
          PATH_CHANGED: ${{ steps.fetch.outputs.path }}
          FEED: ${{ matrix.feed }}
        run: |
          set -euo pipefail
          branch="fetch/${FEED}-${VERSION}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "${branch} already open -- nothing to propose"; exit 0
          fi
          git config user.name "policy-as-versioned feeds bot"
          git config user.email "feeds-bot@${GITHUB_REPOSITORY_OWNER}.invalid"
          git checkout -b "${branch}"
          git add "${PATH_CHANGED}" "${FEED}/bump.yaml"
          git -c gpg.format=x509 -c gpg.x509.program=gitsign \
            commit -S -m "${FEED}: ${BUMP} bump to ${VERSION} from upstream"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "${FEED}: ${BUMP} bump to ${VERSION}" \
            --body "$(printf '%s\n' \
              "The scheduled fetch read upstream and computed a **${BUMP}** bump against \`${FEED}/rule.yaml\`." \
              "" \
              "- new payload: \`${PATH_CHANGED}\`, version \`${VERSION}\`" \
              "- \`${FEED}/bump.yaml\` now declares \`${BUMP}\` (ADR-0019: the declared bump is reviewed in the PR)" \
              "" \
              "Merging publishes nothing. Dispatch \`cut-release.yml\` with feed \`${FEED}\` and version \`${VERSION}\` to sign the tag.")"

      # Unconditional. The series must carry a line for every run, including the
      # days something moved and the days a proposal was already open -- those
      # are the days worth scoring (review, 2026-08-28).
      - name: append the observation -- one dated line per run, whatever the bump
        run: |
          set -euo pipefail
          line=$(cat "${RUNNER_TEMP}/obs/${{ matrix.feed }}.jsonl")
          # The fetch step writes the new payload and bump.yaml into the tree. On
          # the day something moved, the proposal step either committed them on
          # its own branch or exited early because that branch was already open
          # -- and in the second case they are still sitting here. They are a
          # DECLARATION, so this clock discards them rather than carrying them
          # onto the observations branch (ADR-0024, D1). The reading has already
          # been captured into ${RUNNER_TEMP}/obs above.
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd -e .git >/dev/null 2>&1 || true
          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations:observations
            git checkout observations
          else
            git checkout --orphan observations
            git rm -rf --cached . >/dev/null 2>&1 || true
            # `git clean -ffdx -e .git`, not `rm -rf ./*`: the glob does not match
            # dot entries, so .github/ and .gitignore survived the wipe and the
            # cage step below then read them as untracked files OUTSIDE the lane
            # and failed the run. Every publisher's FIRST run died there, so the
            # observations branch never came into existence at all, and the next
            # run took the same path and died the same way (reproduced 2026-08-28).
            git clean -ffdx -e .git >/dev/null
            mkdir -p observations
            printf '%s\n' \
              "# observations" "" \
              "Sub-threshold readings from .github/workflows/fetch.yml (ADR-0024, D1/D2)." \
              "One JSON line per feed per run. Never a declaration: nothing here is" \
              "published, pinned or enforced. The series exists so that a change below a" \
              "feed's threshold is still scoreable later." > observations/README.md
          fi
          mkdir -p observations
          printf '%s\n' "${line}" >> "observations/${{ matrix.feed }}.jsonl"

      # --- the cage (ADR-0024, D1) -------------------------------------------
      # Only OBSERVATION_LANE paths are staged, and nothing else may be left in
      # the tree. The proposal path above pushes a `fetch/*` branch behind a pull
      # request and is a PROPOSAL, not a commit to a published branch; this step
      # is what stops the observation path from ever becoming one.
      - name: the observation cage -- a clock appends observations, never a declaration
        run: |
          set -euo pipefail
          # `git reset` FIRST: the cage builds the index and nothing else. The old
          # guard filtered `git status --porcelain` with `grep -v '^[AMD] '`, which
          # strips exactly the staged-and-clean entries -- so a declaration any
          # earlier step had left in the index was committed and pushed while this
          # step printed "this clock declared nothing" (review, 2026-08-28).
          git reset -q
          for path in ${OBSERVATION_LANE}; do
            # -f: talk/captures/ is gitignored for local runs; the clock is the one
            # caller allowed to commit it.
            if [ -e "${path}" ]; then git add -Af -- "${path}"; fi
          done
          # The STAGED set, judged against the same OBSERVATION_LANE list, never a
          # second regex that could drift from it.
          bad=""
          for f in $(git diff --cached --name-only); do
            ok=0
            for path in ${OBSERVATION_LANE}; do
              case "${f}" in "${path}"|"${path}"/*) ok=1 ;; esac
            done
            [ "${ok}" = 1 ] || bad="${bad} ${f}"
          done
          if [ -n "${bad}" ]; then
            echo "::error::this clock staged a declaration outside the observation lane"
            echo "${bad}"
            exit 1
          fi
          outside="$(git status --porcelain --untracked-files=all | grep -v '^[AMD] ' || true)"
          if [ -n "${outside}" ]; then
            echo "::error::the scheduled fetch left a change outside the observation lane"
            echo "${outside}"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "ok  nothing to observe, and nothing declared"; exit 0
          fi
          git -c gpg.format=x509 -c gpg.x509.program=gitsign \
            -c user.name="policy-as-versioned feeds bot" \
            -c user.email="feeds-bot@${GITHUB_REPOSITORY_OWNER}.invalid" \
            commit -S -m "observe ${{ matrix.feed }}: no change above threshold"
          git push origin observations
