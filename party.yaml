# A demonstration party, not affiliated with, endorsed by or speaking for any real authority it names.
# The party artefact for `feeds` (ADR-0019 point 5: discovery is publishes[]
# on the publisher's own party artefact, and the set of signed publisher
# artefacts IS the catalogue -- there is no central one). Validated against
# platform/party/schema.json. Signed under this repo's gitsign tags and
# nothing else (ADR-0012, ADR-0019 point 2).
#
# `feeds` publishes and inherits nothing: it is a publisher only, so it
# carries no baseline (a baseline is an adopter's selection) and no parents.
party: feeds
roles: [publisher]
inherits: []
publishes:
  - kind: feed
    name: threat-register
    path: threat-register
    payload_schema: threat-register/payload.schema.json
    revoked: []
  - kind: feed
    name: cve
    path: cve
    payload_schema: cve/payload.schema.json
    revoked: []
  - kind: feed
    name: eol
    path: eol
    payload_schema: eol/payload.schema.json
    revoked: []
  # The money instrument itself (ticket 25, ADR-0020): HMRC monthly rates, so a
  # price stated in one currency can be reported in another. A date with no
  # published rate refuses; converters/fx.py is the converter that refuses.
  - kind: feed
    name: fx
    path: fx
    payload_schema: fx/payload.schema.json
    revoked: []
  # The prediction-market series (ticket 49, ADR-0023 D2). ONE mechanical rule
  # over ONE venue, publishing a dated SERIES and no probability-shaped field.
  # A move is derived by the consumer (the twin), never asserted here, and a
  # human-run skill is what classifies one. This feed prices nothing.
  - kind: feed
    name: market-moves
    path: market-moves
    payload_schema: market-moves/payload.schema.json
    revoked: []
  # Dated statements with the place each was read (ticket 50). The feed asserts
  # only that something was said, when, and where; every judgement about it is a
  # grade-5 claim on the twin side. This feed prices nothing.
  - kind: feed
    name: news
    path: news
    payload_schema: news/payload.schema.json
    revoked: []
overlay:
  add: []
  restate: []
